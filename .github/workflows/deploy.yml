name: Deploy

on:
  push:
    branches: [main]
    tags: ["v1.*.*"]
  workflow_dispatch:
    inputs:
      environment:
        description: Deploy to environment
        required: true
        default: staging
        type: choice
        options: [staging, production]

jobs:
  resolve-environment:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.env.outputs.name }}
    steps:
      - id: env
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.environment }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == refs/tags/v1.* ]]; then
            echo "name=production" >> "$GITHUB_OUTPUT"
          else
            echo "name=staging" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: resolve-environment
    runs-on: ubuntu-latest
    if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v1.') }}
    environment: ${{ needs.resolve-environment.outputs.name }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify CI passed before deploy
        uses: actions/github-script@v7
        with:
          script: |
            const requiredChecks = ['backend-unit', 'frontend-check', 'security'];
            for (const checkName of requiredChecks) {
              const checks = await github.rest.checks.listForRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: context.sha,
                check_name: checkName,
              });
              const passed = checks.data.check_runs.some((check) => check.conclusion === 'success');
              if (!passed) {
                core.setFailed(`${checkName} CI must pass before deploy`);
                return;
              }
            }

      - name: Deploy to Railway backend
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "RAILWAY_TOKEN is not configured; skipping Railway deploy."
            exit 0
          fi
          npm install -g @railway/cli
          railway deploy --service backend
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Post-deploy health check
        run: |
          if [ -z "$BACKEND_URL" ]; then
            echo "BACKEND_URL is not configured; skipping health check."
            exit 0
          fi
          sleep 30
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$BACKEND_URL/api/v1/health")
          if [ "$STATUS" != "200" ]; then
            echo "ERROR: Health check failed with status $STATUS"
            exit 1
          fi
          echo "Health check passed"
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
