name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  # ──────────────────────────────────────────────
  # Job 1: Repo hygiene — fail fast on forbidden
  #         artifacts tracked by git.
  # ──────────────────────────────────────────────
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fail if .env files are tracked
        run: |
          FILES=$(git ls-files '*.env' | grep -v '.env.example' || true)
          if [ -n "$FILES" ]; then
            echo "❌ .env files must not be tracked:"
            echo "$FILES"
            exit 1
          fi
          echo "✅ No .env files tracked"

      - name: Fail if __pycache__ or .pyc files are tracked
        run: |
          FILES=$(git ls-files -- '__pycache__' '*.pyc' '*.pyo' '*.pyd' || true)
          if [ -n "$FILES" ]; then
            echo "❌ __pycache__ / .pyc files must not be tracked:"
            echo "$FILES"
            exit 1
          fi
          echo "✅ No __pycache__ or .pyc files tracked"

      - name: Fail if backend/output files are tracked
        run: |
          FILES=$(git ls-files 'backend/output/' || true)
          if [ -n "$FILES" ]; then
            echo "❌ backend/output/ files must not be tracked:"
            echo "$FILES"
            exit 1
          fi
          echo "✅ No backend/output/ files tracked"

      - name: Fail if node_modules or dist are tracked
        run: |
          FILES=$(git ls-files 'node_modules' 'dist' 'frontend/node_modules' 'frontend/dist' || true)
          if [ -n "$FILES" ]; then
            echo "❌ node_modules/ or dist/ must not be tracked:"
            echo "$FILES"
            exit 1
          fi
          echo "✅ No node_modules/ or dist/ files tracked"

      - name: Check for leftover .DS_Store or Thumbs.db
        run: |
          FILES=$(git ls-files '.DS_Store' 'Thumbs.db' || true)
          if [ -n "$FILES" ]; then
            echo "❌ OS junk files tracked:"
            echo "$FILES"
            exit 1
          fi
          echo "✅ No OS junk files tracked"

  # ──────────────────────────────────────────────
  # Job 2: Backend — install, compile, lint, test
  # ──────────────────────────────────────────────
  backend:
    needs: hygiene
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile-check all Python files
        run: python -m compileall app/ tests/ -q

      - name: Lint with ruff
        run: |
          pip install ruff
          ruff check app/ tests/
          ruff format app/ tests/ --check

      - name: Run tests with pytest
        run: python -m pytest tests/ -v --tb=short
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || '' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || '' }}
          SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET || 'test-secret-key-for-ci-at-least-32-characters-long' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || '' }}

      - name: Verify app imports cleanly
        run: python -c "from app.main import app; print('✅ Backend imports OK')"

  # ──────────────────────────────────────────────
  # Job 3: Frontend — install, type-check, lint,
  #           test, build
  # ──────────────────────────────────────────────
  frontend:
    needs: hygiene
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: TypeScript type check
        run: npx tsc -b

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npx vitest run

      - name: Build
        run: npm run build

  # ──────────────────────────────────────────────
  # Job 4: Security audit
  # ──────────────────────────────────────────────
  security:
    needs: hygiene
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: npm audit (fail on critical)
        run: |
          npm audit --audit-level=critical
        continue-on-error: true
        id: npm_audit

      - name: npm audit summary
        if: always()
        run: |
          if [ "${{ steps.npm_audit.outcome }}" = "failure" ]; then
            echo "⚠️ npm audit found critical vulnerabilities — review package.json"
          else
            echo "✅ npm audit passed (no critical vulnerabilities)"
          fi

      - name: Python dependency audit
        working-directory: backend
        run: |
          pip install pip-audit
          pip-audit --desc on -r requirements.txt
        continue-on-error: true
        id: pip_audit

      - name: Python audit summary
        if: always()
        run: |
          if [ "${{ steps.pip_audit.outcome }}" = "failure" ]; then
            echo "⚠️ pip-audit found vulnerabilities — review requirements.txt"
          else
            echo "✅ pip-audit passed (no known vulnerabilities)"
          fi
