services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend/output:/app/output
      - ./backend/app:/app/app
      - ./backend/templates:/app/templates
    env_file:
      - ./backend/.env
    environment:
      - DEBUG=true
      - LATEX_OUTPUT_DIR=/app/output

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE=http://localhost:8000/api/v1
    depends_on:
      - backend