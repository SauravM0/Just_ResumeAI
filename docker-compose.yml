services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend/output:/app/output
      - ./backend/app:/app/app
      - ./backend/templates:/app/templates
    env_file:
      - ./backend/.env
    environment:
      - DEBUG=true
      - LATEX_OUTPUT_DIR=/app/output

  frontend:
    image: node:20-slim
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_BASE=http://localhost:8000/api/v1
    command: >
      sh -c "npm ci && npm run dev -- --host"
    depends_on:
      - backend
