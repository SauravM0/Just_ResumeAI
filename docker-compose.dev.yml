services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --log-level debug
    volumes:
      - ./backend:/app
      - backend_output:/app/output
    environment:
      - LOG_LEVEL=DEBUG
      - APP_ENV=development
      - DEBUG=true
      - CORS_ORIGINS=["http://localhost:3099","http://127.0.0.1:3099","http://localhost:3000","http://127.0.0.1:3000","http://localhost:5173","http://127.0.0.1:5173"]
    ports:
      - "8000:8000"
    # healthcheck: # Disable healthcheck for faster development startup
    #   disable: true
    env_file:
      - .env

  frontend:
    image: justresume-frontend-dev
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    command: npm run dev -- --host 0.0.0.0 --port 3000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3099:3000"
    environment:
      - VITE_API_BASE=http://localhost:8000/api/v1
      - VITE_PORT=3099
      - VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
      - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}
      - VITE_APP_ENV=development
    # healthcheck: # Disable healthcheck for faster development startup
    #   disable: true
    env_file:
      - .env
    depends_on:
      backend:
        condition: service_started

volumes:
  backend_output:
